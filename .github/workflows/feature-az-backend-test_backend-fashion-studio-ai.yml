name: Build and deploy Docker container to Azure Web App - backend-fashion-studio-ai

on:
  push:
    branches:
      - feature/az-backend-test
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'backend-fashion-studio-ai'
  AZURE_WEBAPP_SLOT: 'Production'
  CONTAINER_REGISTRY: 'ghcr.io' # GitHub Container Registry

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: 'Production'
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.CONTAINER_REGISTRY }}/${{ github.repository }}:latest
            ${{ env.CONTAINER_REGISTRY }}/${{ github.repository }}:${{ github.sha }}
          file: ./Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EF165217086F4CE9A645A78109C6B727 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4A5AA38836884F9CA105D9F546BA3C3B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3F90975F5B9E42FB8D163479C4DC84D1 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_WEBAPP_SLOT }}
          images: ${{ env.CONTAINER_REGISTRY }}/${{ github.repository }}:${{ github.sha }}
          configuration-file: ./Dockerfile