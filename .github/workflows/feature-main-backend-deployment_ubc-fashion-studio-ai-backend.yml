# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - ubc-fashion-studio-ai-backend

on:
  push:
    branches:
      - feature/main-backend-deployment
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://ghcr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_d3d31fdc2fd84f80879df0a5a5857c61 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_385f4d4269ba41f993b5a0ead4f35e89 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: ghcr.io/${{ secrets.AzureAppService_ContainerUsername_d3d31fdc2fd84f80879df0a5a5857c61 }}/ghcr.io/kanakamsasikalyan/fashion-studio-ai:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'ubc-fashion-studio-ai-backend'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_8257616027aa47b5bd5b1fd4ff200465 }}
        images: 'ghcr.io/${{ secrets.AzureAppService_ContainerUsername_d3d31fdc2fd84f80879df0a5a5857c61 }}/ghcr.io/kanakamsasikalyan/fashion-studio-ai:${{ github.sha }}'